name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # New main CI can run while an older deployment awaits approval.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: .playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4 (peeled commit)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run content:validate
      - run: pnpm run test
      - run: pnpm run check
      - run: pnpm run test:article-example
      - run: pnpm run security:check
      - run: pnpm audit --audit-level=high
      - run: pnpm run test:collections
      - run: pnpm exec tsx scripts/configure-pages.ts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and verify user-site paths
        env:
          SITE_BASE: /
          # Synthetic public ID; browser tests intercept Google requests.
          PUBLIC_GA_MEASUREMENT_ID: G-123456ABCD
        run: |
          pnpm run build
          pnpm run test:build
          pnpm run test:browser
      - name: Browser verification of production paths
        env:
          PUBLIC_GA_MEASUREMENT_ID: G-123456ABCD
        run: |
          pnpm run build
          pnpm run test:build
          pnpm run test:browser
      - name: Build and verify production artifact without browser execution
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLIC_GA_MEASUREMENT_ID || '' }}
        run: |
          pnpm run build
          pnpm run test:build
      - name: Preserve the exact validated site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-site
          path: dist/
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    # Approval is enforced only after Required reviewers are configured in GitHub.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject stale CI runs after approval
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const branch = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (branch.data.commit.sha !== context.sha) {
              core.setFailed('The validated SHA is no longer main. Approve the current main run instead.');
            }
      - name: Download this run's validated site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-site
          path: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy validated static files
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
