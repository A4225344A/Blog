name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # New main CI can run while an older deployment awaits approval.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: .playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (peeled commit)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run content:validate
      - run: pnpm run test
      - run: pnpm run check
      - run: pnpm run test:collections
      - run: pnpm exec tsx scripts/configure-pages.ts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and verify user-site paths
        env:
          SITE_BASE: /
          # Synthetic public ID; browser tests intercept Google requests.
          PUBLIC_GA_MEASUREMENT_ID: G-123456ABCD
        run: |
          pnpm run build
          pnpm run test:build
          pnpm run test:browser
      - name: Browser verification of production paths
        env:
          PUBLIC_GA_MEASUREMENT_ID: G-123456ABCD
        run: |
          pnpm run build
          pnpm run test:build
          pnpm run test:browser
      - name: Build and verify production artifact without browser execution
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLIC_GA_MEASUREMENT_ID || '' }}
        run: |
          pnpm run build
          pnpm run test:build
      - name: Preserve the exact validated site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-site
          path: dist/
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    # Required reviewers on this environment enforce approval before this job starts.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject stale CI runs after approval
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const branch = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (branch.data.commit.sha !== context.sha) {
              core.setFailed('The validated SHA is no longer main. Approve the current main run instead.');
            }
      - name: Download this run's validated site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-site
          path: site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Deploy approved static files
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
